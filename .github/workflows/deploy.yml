name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so generate-git-commits.js can read all 20 commits.
          # Without this, GitHub Actions only clones the latest commit (depth=1).
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Regenerate git-stats.json
        run: bun scripts/generate-git-stats.js

      - name: Regenerate git-commits.json
        run: bun scripts/generate-git-commits.js

      - name: Regenerate git-meta.json
        run: bun scripts/generate-git-meta.js

      - name: Regenerate activity-feed.json
        run: bun scripts/generate-activity-feed.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: ./app
        env:
          # Project sites are served under /<repo>/ (e.g. /me/)
          BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
          NODE_ENV: "production"
        run: bun run build

      # GitHub Pages has no SPA rewrites; serving index.html as the 404 page
      # lets deep links like /me/projects/<slug> load the app.
      - name: Add SPA fallback
        run: cp app/dist/index.html app/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
